[package]
name = "z-feedback"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "ZFeedback"
path = "src/main.rs"

[dependencies]
tao = "0.30"
wry = "0.46"
tiny_http = "0.12"
serde_json = "1"
include_dir = "0.7"
getrandom = "0.2"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "unwind"
